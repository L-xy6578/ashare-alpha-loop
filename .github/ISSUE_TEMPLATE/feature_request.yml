name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，再描述方案。越具体，越容易被实现。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 现在是怎么做的，哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改
      description: 描述期望的行为、输入输出或命令示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 你考虑过的替代做法，或相关项目是怎么做的。

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 行情采集
        - 因子 / 评分
        - 观察池
        - 模拟交易
        - 真实成交记账
        - 报表 / KPI
        - 文档 / 测试
        - 其他

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 这个建议不涉及自动下单或收益承诺
          required: true
