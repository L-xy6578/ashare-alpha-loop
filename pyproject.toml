[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-alpha-loop"
version = "0.1.0"
description = "AlphaLoop — A-share quantitative research and paper-trading framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Triangle Loop Contributors" }]
keywords = ["quant", "a-share", "alpha", "sqlite", "research", "paper-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/L-xy6578/ashare-alpha-loop"
Issues = "https://github.com/L-xy6578/ashare-alpha-loop/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
tdx = ["pytdx>=1.3"]        # 通达信协议数据源（可选，TCP 7709）
akshare = ["akshare>=1.12"] # akshare 数据源（可选，独立环境备用）

[tool.pytest.ini_options]
# 测试目录与导入路径（src 作为可导入包）
testpaths = ["src/tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.setuptools.packages.find]
include = ["src*"]
